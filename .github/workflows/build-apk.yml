name: Build Fire Web Remote APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FireWebRemote-2.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FireWebRemote-2.0-APK
          path: FireWebRemote-2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
