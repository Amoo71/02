name: Build Fire Web Remote APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply source fix
        run: python3 scripts/fix_service_v21.py

      - name: Apply compact remote layout
        run: python3 scripts/patch_remote_layout.py

      - name: Add sleep timer
        run: python3 scripts/add_sleep_timer.py

      - name: Apply v2.3 UI and debug patch
        run: python3 scripts/patch_v23.py

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish build files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FireWebRemote.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/FireWebRemote-2.3.apk
          cp app/src/main/assets/index.html dist/FireWebRemote.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/FireWebRemote.apk dist/FireWebRemote-2.3.apk dist/FireWebRemote.html
          git diff --cached --quiet || git commit -m "Publish FireWebRemote 2.3 build [skip ci]"
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireWebRemote-2.3-APK
          path: dist/FireWebRemote.apk
          if-no-files-found: error
          retention-days: 30
