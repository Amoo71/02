<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fire Control</title>
<style>
:root{--bg:#050507;--panel:#151518e8;--panel2:#0c0c10;--line:#ffffff12;--text:#f5f5f7;--muted:#85858d;--accent:#f5f5f7;--danger:#ff7b72;--nav:68px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050507;color-scheme:dark}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 55% -12%,#2e3038 0,#0c0c10 34%,#050507 72%);-webkit-font-smoothing:antialiased;touch-action:manipulation}
button,input{font:inherit}.appShell{height:100dvh;max-width:700px;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 8px);display:grid;grid-template-rows:54px minmax(0,1fr) var(--nav);gap:9px}.header{display:flex;align-items:center;justify-content:space-between;min-width:0}.brand{display:flex;align-items:center;gap:10px;min-width:0}.orb{width:38px;height:38px;border-radius:12px;flex:0 0 auto;background:linear-gradient(145deg,#7d818c,#292b32);box-shadow:inset 0 1px 1px #ffffff45,0 10px 26px #0009}.brandText{min-width:0}.brand h1{margin:0;font-size:22px;line-height:1;letter-spacing:-.04em}.host{font-size:11px;color:#7d7d85;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{font-size:11px;font-weight:750;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#18181c;white-space:nowrap;color:#b8b8be}.stage{min-height:0;position:relative}.view{display:none;height:100%;min-height:0}.view.active{display:block}.glass{height:100%;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 22px 70px #0008,inset 0 1px #ffffff09;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);overflow:hidden}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:7px;border:1px solid var(--line);border-radius:22px;background:#111114e8;box-shadow:0 15px 50px #0008;backdrop-filter:blur(24px)}.navBtn{border:0;border-radius:16px;background:transparent;color:#77777f;font-weight:700;font-size:12px;display:grid;place-items:center;gap:2px}.navBtn b{font-size:20px;line-height:20px;font-weight:600}.navBtn.sel{background:#f2f2f4;color:#101014;box-shadow:0 5px 20px #0008}.navBtn:active{transform:scale(.98)}
.appsView{display:grid;grid-template-rows:44px minmax(0,1fr) 42px;gap:8px;padding:11px}.appsBar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px}.search{min-width:0;border:1px solid var(--line);background:#09090c;border-radius:13px;color:white;padding:0 12px;outline:none;font-size:12px}.chip{border:1px solid var(--line);background:#212126;color:#ddd;border-radius:13px;padding:0 11px;font-size:11px;font-weight:700}.chip.on{background:#f4f4f5;color:#111}.appGrid{min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:7px}.tile{position:relative;min-width:0;min-height:0;border:1px solid #ffffff0d;border-radius:18px;background:linear-gradient(150deg,#1b1b20,#0c0c10 70%);color:white;padding:7px 5px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden;box-shadow:inset 0 1px #ffffff08}.tile:active{transform:scale(.965);background:#1e1e23}.tile.hiddenTile{opacity:.65}.iconBox{width:clamp(40px,10vw,58px);height:clamp(40px,10vw,58px);border-radius:14px;background:#25252b;box-shadow:0 9px 25px #0008,inset 0 1px #ffffff15;overflow:hidden;display:grid;place-items:center}.iconBox img{width:100%;height:100%;object-fit:cover}.fallback{font-weight:800;font-size:19px;color:#c9c9d0}.tileName{width:100%;font-size:10px;font-weight:700;line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}.more{position:absolute;right:4px;top:4px;width:25px;height:25px;border:0;border-radius:9px;background:#0008;color:#aaa;font-weight:900;line-height:1}.sysDot{position:absolute;left:7px;top:7px;width:6px;height:6px;background:#777;border-radius:50%;box-shadow:0 0 0 2px #111}.pager{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:7px}.pageBtn{height:38px;border:1px solid var(--line);background:#202025;color:#fff;border-radius:13px;font-size:18px}.pageInfo{text-align:center;color:#8e8e96;font-size:11px;font-weight:650}.empty{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;text-align:center;color:#777;font-size:12px;padding:20px}
.remoteView{padding:10px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:7px}.sectionTitle{font-size:12px;color:#8d8d95;font-weight:750;text-transform:uppercase;letter-spacing:.08em;padding:2px 4px}.remoteGrid{min-height:0;display:block}.dpadPanel{height:100%;border:1px solid var(--line);border-radius:19px;background:#0c0c10;padding:8px;display:grid;grid-template-rows:minmax(0,1fr) 44px 44px;gap:6px;overflow:hidden}.dpad{width:min(100%,340px);height:auto;max-height:100%;aspect-ratio:1;margin:auto;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:6px;min-width:0;min-height:0}.rbtn{min-width:0;min-height:0;border:1px solid #ffffff12;background:linear-gradient(#29292f,#1b1b20);color:#f7f7f8;border-radius:16px;font-weight:800;font-size:18px;box-shadow:inset 0 1px #ffffff12,0 8px 20px #0005}.rbtn:active{transform:scale(.95);background:#131317}.rbtn.ok{background:#f4f4f5;color:#111}.utilityRow,.volumeRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.utilityRow .rbtn,.volumeRow .rbtn{font-size:11px;border-radius:13px}.volumeRow .rbtn{font-size:10px}.mute{color:#ffb3ae}
.toolsView{padding:10px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:7px}.toolGrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) 46px;gap:7px;min-height:0}.toolBtn{min-height:0;border:1px solid var(--line);border-radius:16px;background:linear-gradient(150deg,#242429,#151519);color:#fff;text-align:left;padding:10px 11px;font-weight:750;font-size:12px;box-shadow:inset 0 1px #ffffff0d}.toolBtn span{display:block;font-size:9px;font-weight:500;color:#7f7f87;margin-top:3px;line-height:1.2}.toolBtn:active{transform:scale(.98)}.toolBtn.danger{color:#ff8d85;background:#211719}.toolBtn.compact{height:46px;padding:0 12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px}.timerCard{grid-column:1/-1;border:1px solid var(--line);border-radius:17px;background:#0c0c10;padding:10px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:9px;min-height:58px}.timerInfo{min-width:76px}.timerTitle{font-size:11px;font-weight:800}.timerState{font-size:9px;color:#8a8a92;margin-top:3px;white-space:nowrap}.timerChoices{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.timerChoice{height:34px;border:1px solid var(--line);border-radius:11px;background:#242429;color:#eee;font-size:10px;font-weight:800}.timerChoice:active{transform:scale(.96)}.timerChoice.cancel{color:#ff9b94;background:#211719}.maintenanceBtn{height:100%}
.idle{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#24262c,#08080b 45%,#030304);z-index:20;display:none;align-items:center;justify-content:center;padding:28px}.idle.on{display:flex}.idleCard{width:min(390px,100%);border:1px solid var(--line);background:#131317e8;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 30px 90px #000}.moon{width:78px;height:78px;border-radius:25px;margin:auto;background:#0a0a0d;display:grid;place-items:center;font-size:32px;box-shadow:inset 0 1px #ffffff12,0 18px 50px #000}.idle h2{font-size:28px;letter-spacing:-.04em;margin:18px 0 7px}.idle p{font-size:12px;line-height:1.5;color:#777780;margin:0 0 22px}.wake{width:100%;border:0;border-radius:17px;background:#f5f5f7;color:#111;padding:16px;font-weight:800}.sheetShade{position:fixed;inset:0;background:#0009;backdrop-filter:blur(7px);z-index:30;display:none;align-items:flex-end}.sheetShade.on{display:flex}.sheet{width:min(700px,100%);margin:auto;background:#17171bef;border:1px solid #ffffff17;border-radius:25px 25px 0 0;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -25px 80px #000}.grab{width:36px;height:4px;border-radius:9px;background:#555;margin:0 auto 12px}.sheetHead{display:flex;align-items:center;gap:11px;padding:0 3px 12px}.sheetIcon{width:46px;height:46px;border-radius:13px;background:#29292f;object-fit:cover}.sheetName{font-size:16px;font-weight:800}.sheetPkg{font-size:10px;color:#777;font-family:ui-monospace,Menlo,monospace;margin-top:3px;word-break:break-all}.sheetBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.sheetBtn{border:1px solid var(--line);background:#29292f;color:#fff;border-radius:14px;padding:13px 8px;font-weight:750;font-size:12px}.sheetBtn.hide{color:#ffb36c}.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 83px);transform:translate(-50%,14px);z-index:50;background:#29292fdd;border:1px solid #ffffff18;border-radius:13px;padding:10px 13px;font-size:11px;opacity:0;transition:.18s;pointer-events:none;max-width:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-height:700px){:root{--nav:60px}.appShell{grid-template-rows:48px minmax(0,1fr) var(--nav);gap:6px}.brand h1{font-size:19px}.orb{width:33px;height:33px}.appsView{grid-template-rows:39px minmax(0,1fr) 37px;padding:8px}.appGrid{gap:5px}.tile{border-radius:14px;padding:4px}.iconBox{width:38px;height:38px;border-radius:11px}.tileName{font-size:9px}.remoteView,.toolsView{padding:8px}.dpadPanel,.sidePanel{padding:7px}.toolBtn{padding:10px}.nav{padding:5px}.navBtn b{font-size:17px}}
@media(max-width:380px){.appGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.appsBar{grid-template-columns:minmax(0,1fr) auto}.chip.sys{display:none}.dpadPanel{padding:6px;grid-template-rows:minmax(0,1fr) 40px 40px}.dpad{gap:5px}.rbtn{border-radius:14px}.utilityRow,.volumeRow{gap:4px}.timerInfo{min-width:65px}.timerChoices{gap:3px}}
</style>
</head>
<body>
<div class="appShell" id="appShell">
<header class="header"><div class="brand"><div class="orb"></div><div class="brandText"><h1>Fire Control</h1><div id="host" class="host">Local Fire TV</div></div></div><div id="state" class="state">Connecting…</div></header>
<main class="stage">
<section id="appsView" class="view active"><div class="glass appsView"><div class="appsBar"><input id="search" class="search" placeholder="Search apps…" autocomplete="off"><button id="hiddenChip" class="chip">Hidden 0</button><button id="systemChip" class="chip sys">System</button></div><div id="appGrid" class="appGrid"><div class="empty">Loading apps…</div></div><div class="pager"><button class="pageBtn" id="prevPage">‹</button><div id="pageInfo" class="pageInfo">1 / 1</div><button class="pageBtn" id="nextPage">›</button></div></div></section>
<section id="remoteView" class="view"><div class="glass remoteView"><div class="sectionTitle">Remote</div><div class="remoteGrid"><div class="dpadPanel"><div class="dpad"><span></span><button class="rbtn" data-key="up">▲</button><span></span><button class="rbtn" data-key="left">◀</button><button class="rbtn ok" data-key="ok">OK</button><button class="rbtn" data-key="right">▶</button><span></span><button class="rbtn" data-key="down">▼</button><span></span></div><div class="utilityRow"><button class="rbtn" data-key="back">Back</button><button class="rbtn" data-key="home">Home</button><button class="rbtn" data-key="menu">Menu</button></div><div class="volumeRow"><button class="rbtn" data-key="voldown">VOL −</button><button class="rbtn mute" data-key="mute">MUTE</button><button class="rbtn" data-key="volup">VOL +</button></div></div></div></div></section>
<section id="toolsView" class="view"><div class="glass toolsView"><div class="sectionTitle">Tools</div><div class="toolGrid"><div class="timerCard"><div class="timerInfo"><div class="timerTitle">Sleep Timer</div><div id="sleepTimerState" class="timerState">Off</div></div><div class="timerChoices"><button class="timerChoice" data-sleep-hours="1">1h</button><button class="timerChoice" data-sleep-hours="2">2h</button><button class="timerChoice" data-sleep-hours="3">3h</button><button id="sleepTimerCancel" class="timerChoice cancel">OFF</button></div></div><button class="toolBtn maintenanceBtn" data-tool="kill-background">Clean Background<span>Kill cached/background apps</span></button><button class="toolBtn maintenanceBtn" data-tool="trim-cache">Trim Caches<span>Reclaim app cache</span></button><button id="updateBtn" class="toolBtn compact">Update</button><button class="toolBtn danger compact" data-tool="sleep">OFF</button></div></div></section>
</main>
<nav class="nav"><button class="navBtn sel" data-tab="apps"><b>▦</b>Apps</button><button class="navBtn" data-tab="remote"><b>✣</b>Remote</button><button class="navBtn" data-tab="tools"><b>⌁</b>Tools</button></nav>
</div>
<div id="idle" class="idle"><div class="idleCard"><div class="moon">◐</div><h2>Ultra Idle</h2><p>Fire Control is sleeping. Wake it to enable apps, remote controls and tools again.</p><button id="wakeBtn" class="wake">Wake Fire TV</button></div></div>
<div id="sheetShade" class="sheetShade"><div class="sheet"><div class="grab"></div><div class="sheetHead"><img id="sheetIcon" class="sheetIcon"><div style="min-width:0"><div id="sheetName" class="sheetName"></div><div id="sheetPkg" class="sheetPkg"></div></div></div><div class="sheetBtns"><button id="sheetOpen" class="sheetBtn">Open</button><button id="sheetStop" class="sheetBtn">Stop</button><button id="sheetHide" class="sheetBtn hide">Hide</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const S={apps:[],idle:true,remain:0,sleepTimer:0,page:0,system:false,showHidden:false,selected:null,hidden:new Set(JSON.parse(localStorage.getItem('hiddenApps')||'[]')),lastUse:Date.now(),lastPing:0,debugTapCount:0,debugTapAt:0};
const $=id=>document.getElementById(id);
const pageSize=()=>innerWidth<=380?9:12;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(S.tt);S.tt=setTimeout(()=>e.classList.remove('on'),1800)}
async function api(url,quiet=false){const r=await fetch(url,{cache:'no-store'});let d={};try{d=await r.json()}catch(e){}if(r.status===423){showIdle();throw new Error('Ultra Idle')}if(!d.ok)throw new Error(d.error||'Request failed');return d}
function showIdle(){S.idle=true;$('idle').classList.add('on');$('state').textContent='Ultra Idle'}
function showActive(){S.idle=false;$('idle').classList.remove('on')}
function saveHidden(){localStorage.setItem('hiddenApps',JSON.stringify([...S.hidden]));$('hiddenChip').textContent='Hidden '+S.hidden.size}
function noteUse(){if(S.idle)return;S.lastUse=Date.now();S.remain=90000;if(Date.now()-S.lastPing>1800){S.lastPing=Date.now();fetch('/api/keepalive',{cache:'no-store'}).catch(()=>{})}}
['pointerdown','touchstart','keydown','input'].forEach(ev=>document.addEventListener(ev,noteUse,{capture:true,passive:ev!=='keydown'}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)noteUse()});
setInterval(()=>{if(!S.idle&&!document.hidden&&Date.now()-S.lastUse<90000&&Date.now()-S.lastPing>7000)noteUse()},4000);
function filteredApps(){const q=$('search').value.trim().toLowerCase();let a=S.apps.filter(x=>(S.system||!x.system)&&(S.showHidden?S.hidden.has(x.package):!S.hidden.has(x.package))&&(x.name.toLowerCase().includes(q)||x.package.toLowerCase().includes(q)));const pin={'org.smarttube.stable':0,'net.vypn.app':1};a.sort((x,y)=>(pin[x.package]??99)-(pin[y.package]??99)||x.name.localeCompare(y.name));return a}
function renderApps(){const a=filteredApps(),ps=pageSize(),pages=Math.max(1,Math.ceil(a.length/ps));S.page=Math.max(0,Math.min(S.page,pages-1));const part=a.slice(S.page*ps,S.page*ps+ps);$('appGrid').innerHTML=part.length?part.map(x=>`<button class="tile ${S.showHidden?'hiddenTile':''}" data-open="${esc(x.package)}"><span class="iconBox"><img loading="lazy" src="/api/icon?package=${encodeURIComponent(x.package)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fallback" style="display:none">${esc((x.name||'?').slice(0,1).toUpperCase())}</span></span><span class="tileName">${esc(x.name)}</span>${x.system?'<span class="sysDot"></span>':''}<span class="more" data-more="${esc(x.package)}">•••</span></button>`).join(''):'<div class="empty">'+(S.showHidden?'No hidden apps.':'No matching apps.')+'</div>';$('pageInfo').textContent=(S.page+1)+' / '+pages+' · '+a.length+' apps';$('prevPage').disabled=S.page===0;$('nextPage').disabled=S.page>=pages-1;saveHidden()}
function findApp(p){return S.apps.find(x=>x.package===p)}
function openSheet(p){const a=findApp(p);if(!a)return;S.selected=a;$('sheetName').textContent=a.name;$('sheetPkg').textContent=a.package;$('sheetIcon').src='/api/icon?package='+encodeURIComponent(a.package);$('sheetOpen').disabled=!a.launchable;$('sheetHide').textContent=S.hidden.has(a.package)?'Unhide':'Hide';$('sheetShade').classList.add('on');noteUse()}
function closeSheet(){$('sheetShade').classList.remove('on');S.selected=null}
async function action(type,p){try{const d=await api('/api/action?type='+encodeURIComponent(type)+'&package='+encodeURIComponent(p));S.remain=90000;toast(d.message||'Done')}catch(e){toast(e.message)}}
async function remote(key){try{const d=await api('/api/remote?key='+encodeURIComponent(key));S.remain=90000;toast(d.message||key)}catch(e){toast(e.message)}}
async function tool(type){try{const d=await api('/api/tool?type='+encodeURIComponent(type));if(type==='sleep')showIdle();else S.remain=90000;toast(d.message||'Done')}catch(e){toast(e.message)}}
function formatSleep(ms){if(!ms||ms<=0)return 'Off';const total=Math.max(1,Math.ceil(ms/60000));const h=Math.floor(total/60),m=total%60;return h>0?(h+'h '+String(m).padStart(2,'0')+'m'):(m+'m')}
function renderSleepTimer(){$('sleepTimerState').textContent=S.sleepTimer>0?'Turns off in '+formatSleep(S.sleepTimer):'Off'}
async function setSleepTimer(hours){try{if(hours===1){const now=Date.now();S.debugTapCount=(now-S.debugTapAt<2500)?S.debugTapCount+1:1;S.debugTapAt=now;if(S.debugTapCount>=5){S.debugTapCount=0;const d=await api('/api/sleep-timer?action=debug');S.sleepTimer=d.remainingMs||60000;renderSleepTimer();toast(d.message||'Sleep timer set');return}}else{S.debugTapCount=0}const d=await api('/api/sleep-timer?action=set&hours='+hours);S.sleepTimer=d.remainingMs||hours*3600000;renderSleepTimer();toast(d.message||('Sleep in '+hours+'h'))}catch(e){toast(e.message)}}
async function cancelSleepTimer(){try{const d=await api('/api/sleep-timer?action=cancel');S.sleepTimer=0;renderSleepTimer();toast(d.message||'Sleep timer cancelled')}catch(e){toast(e.message)}}
async function updateApp(){if(!confirm('Download and install the latest Fire Web Remote APK?'))return;const b=$('updateBtn');b.disabled=true;try{toast('Downloading update…');const d=await api('/api/update');toast(d.message||'Restarting…');setTimeout(()=>location.reload(),9000)}catch(e){b.disabled=false;toast(e.message||'Update failed')}}
async function loadApps(){try{const d=await api('/api/apps');S.apps=d.apps||[];renderApps()}catch(e){toast(e.message)}}
async function wake(){try{const d=await api('/api/wake');showActive();S.remain=d.remainingMs||30000;S.lastUse=Date.now();S.lastPing=Date.now();await loadApps();toast('Awake')}catch(e){toast(e.message)}}
async function sync(){try{const d=await api('/api/status',true);S.remain=d.remainingMs||0;S.sleepTimer=d.sleepTimerRemainingMs||0;renderSleepTimer();$('host').textContent=d.ip+':'+d.port;if(d.idle)showIdle();else{showActive();if(!S.apps.length)await loadApps()}}catch(e){$('state').textContent='Offline'}}
function setTab(t){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.navBtn').forEach(b=>b.classList.toggle('sel',b.dataset.tab===t));$(t+'View').classList.add('active');noteUse()}
$('search').addEventListener('input',()=>{S.page=0;renderApps()});$('hiddenChip').onclick=()=>{S.showHidden=!S.showHidden;S.page=0;$('hiddenChip').classList.toggle('on',S.showHidden);renderApps()};$('systemChip').onclick=()=>{S.system=!S.system;S.page=0;$('systemChip').classList.toggle('on',S.system);renderApps()};$('prevPage').onclick=()=>{S.page--;renderApps();noteUse()};$('nextPage').onclick=()=>{S.page++;renderApps();noteUse()};
document.querySelectorAll('.navBtn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>remote(b.dataset.key));document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>tool(b.dataset.tool));document.querySelectorAll('[data-launch]').forEach(b=>b.onclick=()=>action('launch',b.dataset.launch));document.querySelectorAll('[data-sleep-hours]').forEach(b=>b.onclick=()=>setSleepTimer(Number(b.dataset.sleepHours)));$('sleepTimerCancel').onclick=cancelSleepTimer;$('updateBtn').onclick=updateApp;
$('appGrid').onclick=e=>{const more=e.target.closest('[data-more]');if(more){e.stopPropagation();openSheet(more.dataset.more);return}const tile=e.target.closest('[data-open]');if(tile){const a=findApp(tile.dataset.open);if(S.showHidden)openSheet(tile.dataset.open);else if(a&&a.launchable)action('launch',tile.dataset.open);else openSheet(tile.dataset.open)}};
$('sheetShade').onclick=e=>{if(e.target===$('sheetShade'))closeSheet()};$('sheetOpen').onclick=()=>{if(S.selected){action('launch',S.selected.package);closeSheet()}};$('sheetStop').onclick=()=>{if(S.selected){action('force-stop',S.selected.package);closeSheet()}};$('sheetHide').onclick=()=>{if(!S.selected)return;const p=S.selected.package;if(S.hidden.has(p))S.hidden.delete(p);else S.hidden.add(p);saveHidden();closeSheet();renderApps()};$('wakeBtn').onclick=wake;
addEventListener('resize',()=>{S.page=0;renderApps()});
setInterval(()=>{if(S.sleepTimer>0){S.sleepTimer=Math.max(0,S.sleepTimer-1000);renderSleepTimer();if(S.sleepTimer===0)setTimeout(sync,1200)}if(!S.idle){S.remain=Math.max(0,S.remain-1000);$('state').textContent='Awake · '+Math.ceil(S.remain/1000)+'s';if(S.remain<=0)sync()}},1000);
saveHidden();sync();
</script>
</body>
</html>
